[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page-app fallback: serve index.html for any path that isn't a real
# file, so client-side routes like /services/:slug work on direct load / refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
